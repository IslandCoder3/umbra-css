<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Umbra: ready-made CSS designs</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="style.css">
<script src="theme.js"></script>
</head>
<body>
<header class="site" id="top"><div class="siteIn"><a class="brand" href="#top" aria-label="Umbra"><svg width="32" height="32" viewBox="0 0 28 28" aria-hidden="true"><circle cx="16" cy="16" r="9" fill="currentColor" opacity=".25"/><circle cx="12" cy="12" r="9" fill="var(--lamp)"/></svg><span class="wm">Umbra</span></a><nav class="links" aria-label="Main"><a href="#gallery" aria-current="page">Designs</a><a href="#tools">Tools</a><a href="studio.html">Studio</a></nav><button id="theme" class="tswitch" type="button" role="switch" aria-checked="true" aria-label="Dark mode" title="Toggle theme"><svg class="sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><svg class="moon" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><span class="knob"></span></button></div></header>
<div class="shell">
  <section class="hero"><h2>Pick a design. Copy the CSS.</h2><p id="lead"></p><div class="search"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search designs" aria-label="Search designs"><kbd>/</kbd></div></section>
  <div class="bar"><div class="filters" id="filters" role="group" aria-label="Filter by category"></div></div>
  <main class="gallery" id="gallery"></main>
  <p class="empty" id="empty" hidden>No designs match. Try another word or category.</p>
  <section class="toolsec" id="tools"><h3>Build your own</h3><p class="sub">Open any generator in the studio.</p><div class="tgrid" id="tgrid"></div></section>
  <div id="live" aria-live="polite" style="position:absolute;left:-9999px">&nbsp;</div>
</div>
<footer class="foot"><span>Umbra. Plain CSS you can copy.</span><a href="#top">Back to top</a></footer>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle" hidden>
  <div class="dhead"><div><b id="dtitle"></b><small id="dcat"></small></div><button class="chip" id="dclose" type="button">Close</button></div>
  <div class="tstage big" id="dstage"><div id="dpv"></div></div>
  <label for="dcode">CSS. Edit it and the preview updates.</label>
  <textarea id="dcode" spellcheck="false"></textarea>
  <div class="dfoot"><button class="chip" id="dreset" type="button">Reset</button><a class="chip" id="dstudio" href="studio.html" hidden>Open in studio</a><button class="btn" id="dcopy" type="button">Copy CSS</button></div>
</aside>
<script src="tools.js"></script>
<script src="home.js"></script>
</body>
</html>
